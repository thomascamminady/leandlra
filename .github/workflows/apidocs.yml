name: API docs

# doc-gen4 API reference. The first run documents all of Mathlib (over an hour); later runs reuse
# docgen-action's Mathlib cache. The output is saved to the Actions cache, and the Pages workflow
# (triggered when this one completes) publishes it under docs/.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apidocs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      # doc-gen4 documents the modules that the root file of the default library imports. That is
      # the core (docs/STRUCTURE.md); for this build only, the root file also imports the
      # catalogue, so that the reference covers every module the website links to.
      - name: Import every module in the root file
        run: |
          scripts/gen_root.sh
          grep '^import LeanDLRA\.' LeanDLRACatalogue.lean >> LeanDLRA.lean
      - name: Install Lean and build the library
        uses: leanprover/lean-action@v1
      - name: Build API documentation (doc-gen4)
        uses: leanprover-community/docgen-action@v1
        with:
          # A folder that does not exist yet: the action skips its own Jekyll build and only
          # writes the API documentation to _apidocs/docs.
          homepage: _apidocs
          build-page: false
          deploy: false
      - name: Save API documentation for the Pages workflow
        uses: actions/cache/save@v4
        with:
          path: _apidocs/docs
          key: apidocs-${{ github.sha }}
