name: Certify

# Run by hand once the library is finished. It takes hours: a build from Mathlib's published oleans only,
# nothing cached from this project, then every check in sequence. The result is a certificate tied to the
# commit, signed with a GitHub build attestation and published as a release.
#
# Verify a downloaded certificate with:
#   gh attestation verify certificate.json --repo thomascamminady/leandlra
on:
  workflow_dispatch:
    inputs:
      external_checkers:
        description: Also replay through lean4lean, nanoda, con-leche and con-ron (slow)
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Nothing unproved is left
        run: |
          ! grep -rnE '\bsorry\b|\bsorryAx\b|\badmit\b|native_decide|implemented_by|\bextern\b|\bunsafe\b|debug\.skipKernelTC' LeanDLRA LeanDLRA.lean LeanDLRACatalogue.lean

      - uses: astral-sh/setup-uv@v6

      - name: Root files are generated and committed, and the core imports no catalogue module
        run: |
          scripts/gen_root.sh
          git diff --exit-code -- LeanDLRA.lean LeanDLRACatalogue.lean
          uv run -q scripts/core.py check

      # Everything is certified: the core library and the catalogue (docs/STRUCTURE.md).
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          build-args: --wfail LeanDLRACatalogue

      - name: Axiom audit of every constant
        run: scripts/audit.sh LeanDLRACatalogue

      - name: Statements are the recorded ones
        run: uv run -q scripts/fidelity.py

      - name: Kernel replay of every module, one at a time
        run: scripts/replay.sh

      - name: Sandbox for the external checkers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Export and replay in a sandbox (Lean kernel)
        if: ${{ !inputs.external_checkers }}
        run: lake check

      - name: Export and replay in a sandbox (all bundled checkers)
        if: ${{ inputs.external_checkers }}
        run: lake check --paranoid

      - name: Write the certificate
        env:
          EXTERNAL: ${{ inputs.external_checkers }}
        run: |
          checks="clean build with --wfail,no placeholders,axiom audit of every constant"
          checks="$checks,statement fidelity,leanchecker replay of every module,lake check sandboxed export"
          if [ "$EXTERNAL" = "true" ]; then
            checks="$checks,leanchecker-paranoid,lean4lean,nanoda,con-leche,con-ron"
          fi
          uv run -q scripts/certificate.py "$checks"

      - name: Attest the certificate
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: certificate.json

      - name: Publish a release with the certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="certified-$(git rev-parse --short=12 HEAD)"
          gh release create "$tag" certificate.json --target "$(git rev-parse HEAD)" \
            --title "Certified $(git rev-parse --short=12 HEAD)" \
            --notes "Every check of .github/workflows/certify.yml passed on this commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
