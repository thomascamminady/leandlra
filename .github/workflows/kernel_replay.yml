name: Kernel replay

# Replay every declaration of the core and of the catalogue through the kernel, independently of
# elaboration. It takes
# about an hour because each module loads all of Mathlib, so it runs nightly and not on every push.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Generate the root files
        run: scripts/gen_root.sh
      - uses: leanprover/lean-action@v1
        with:
          build-args: --wfail LeanDLRACatalogue
      - name: Replay every module
        run: scripts/replay.sh
