name: Pages

# Project website (just-the-docs): pages generated from README, docs/ and the Lean declaration
# index. The doc-gen4 API reference (core library only) is built by the separate "API docs"
# workflow (nightly) and downloaded here from its newest `apidocs-html` artifact, so the site
# itself deploys in minutes. A successful "API docs" run triggers a redeploy that picks up the
# fresh documentation.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["API docs"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-site
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    # A failed or cancelled "API docs" run brings nothing to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate the root files
        run: scripts/gen_root.sh
      # The site lists every module, so everything is built: the core and the catalogue
      # (docs/STRUCTURE.md).
      - name: Install Lean and build everything
        uses: leanprover/lean-action@v1
        with:
          build-args: LeanDLRACatalogue
      - name: Declaration index (names, modules, source lines)
        run: lake env lean scripts/DeclIndex.lean
      - uses: astral-sh/setup-uv@v6
      - name: Generate site pages
        run: uv run -q scripts/build_site.py
      - uses: actions/configure-pages@v6
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: website
          destination: ./_site
      - name: Download API documentation (newest available)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest artifact of this repository and branch (not of a fork) that has not expired.
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=apidocs-html&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not)
                   | select(.workflow_run.head_branch == \"$GITHUB_REF_NAME\")
                   | select(.workflow_run.head_repository_id == $GITHUB_REPOSITORY_ID)]
                  | sort_by(.created_at) | last | .workflow_run.id // empty")
          if [ -z "$run_id" ]; then echo "No API documentation available."; exit 0; fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name apidocs-html --dir "$RUNNER_TEMP/apidocs"
          mkdir -p _apidocs
          tar --zstd -xf "$RUNNER_TEMP/apidocs/apidocs-html.tar.zst" -C _apidocs
          mv _apidocs/doc _apidocs/docs
          echo "API documentation of run $run_id: $(find _apidocs/docs -type f | wc -l) files."
      - name: Add API documentation to the site
        run: |
          if [ -d _apidocs/docs ]; then sudo cp -r _apidocs/docs _site/docs; fi
          sudo chown -R "$(id -u):$(id -g)" _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
