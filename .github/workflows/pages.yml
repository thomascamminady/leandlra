name: Pages

# Project website (just-the-docs): pages generated from README, docs/ and the Lean declaration
# index. The doc-gen4 API reference is built by the separate "API docs" workflow (slow: it
# documents Mathlib too) and restored here from the Actions cache, so the site itself deploys in
# minutes. A finished "API docs" run triggers a redeploy that picks up the fresh documentation.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["API docs"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages-site
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate the root files
        run: scripts/gen_root.sh
      # The site lists every module, so everything is built: the core and the catalogue
      # (docs/STRUCTURE.md).
      - name: Install Lean and build everything
        uses: leanprover/lean-action@v1
        with:
          build-args: LeanDLRACatalogue
      - name: Declaration index (names, modules, source lines)
        run: lake env lean scripts/DeclIndex.lean
      - uses: astral-sh/setup-uv@v6
      - name: Generate site pages
        run: uv run -q scripts/build_site.py
      - uses: actions/configure-pages@v6
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: website
          destination: ./_site
      - name: Restore API documentation (latest available)
        uses: actions/cache/restore@v4
        with:
          path: _apidocs/docs
          key: apidocs-${{ github.sha }}
          restore-keys: apidocs-
      - name: Add API documentation to the site
        run: |
          if [ -d _apidocs/docs ]; then sudo cp -r _apidocs/docs _site/docs; fi
          sudo chown -R "$(id -u):$(id -g)" _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
