name: Create Release

# The Lean template tagged and published a release named after the toolchain on every
# lean-toolchain push. This project versions its releases itself (v0.1.0 through Certify), so the
# workflow runs only when started by hand.
on:
  workflow_dispatch:

jobs:
  lean-release-tag:
    name: Add Lean release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: lean-release-tag action
      uses: leanprover-community/lean-release-tag@v1
      with:
        do-release: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
